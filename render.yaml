# Blueprint Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reto-02-contratos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: ALLOW_DEMO_RESET
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
